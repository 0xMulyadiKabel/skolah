{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Portal Orang Tua</title>
  <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-800 to-emerald-950 p-6">
  <div class="w-full max-w-md bg-white rounded-3xl p-10 shadow-2xl text-center">
    <div class="w-14 h-14 rounded-2xl bg-emerald-800 text-white flex items-center justify-center text-2xl mb-5 mx-auto">🕌</div>
    <h1 class="text-xl font-extrabold text-gray-900">Portal Orang Tua</h1>
    <p class="text-sm text-gray-500 mt-1 mb-6">Pantau kehadiran putra/putri Anda<br>SMA Islam Al Maarif</p>

    {% if form.errors %}
      <div class="bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">Username atau kata sandi salah. Coba lagi.</div>
    {% endif %}

    <form method="post" class="text-left">
      {% csrf_token %}
      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-500 mb-2">Username</label>
        <input type="text" name="username" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-emerald-700 focus:outline-none">
      </div>
      <div class="mb-6">
        <label class="block text-xs font-bold text-gray-500 mb-2">Kata Sandi</label>
        <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-emerald-700 focus:outline-none">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-emerald-800 text-white font-bold hover:bg-emerald-900 transition">Masuk</button>
    </form>
    <p class="text-xs text-gray-400 mt-4">Belum punya akun? Hubungi pihak sekolah.</p>
  </div>
</body>
</html>
