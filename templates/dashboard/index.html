{% extends "base_admin.html" %}

{% block content %}

  <!-- STAT CARDS -->
  <div class="grid grid-cols-4 gap-4 mb-6">

      <div class="w-9 h-9 rounded-lg bg-emerald-50 text-emerald-800 flex items-center justify-center mb-3">🎓</div>
      <div class="text-2xl font-extrabold font-mono">{{ total_siswa }}</div>
      <div class="text-xs text-gray-500 font-bold mt-1">Total Siswa Aktif</div>
    </div>
    <div class="bg-white border border-gray-200 rounded-2xl p-5">

    </div>
    <div class="bg-white border border-gray-200 rounded-2xl p-5">
      <div class="w-9 h-9 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center mb-3">📝</div>
      <div class="text-2xl font-extrabold font-mono">{{ izin }}</div>
      <div class="text-xs text-gray-500 font-bold mt-1">Izin / Sakit</div>
    </div>
    <div class="bg-white border border-gray-200 rounded-2xl p-5">
      <div class="w-9 h-9 rounded-lg bg-red-50 text-red-600 flex items-center justify-center mb-3">⚠️</div>
      <div class="text-2xl font-extrabold font-mono">{{ belum_absen }}</div>
      <div class="text-xs text-gray-500 font-bold mt-1">Belum Absen / Alpa</div>
    </div>

  {% include "dashboard/_live_checkin.html" %}
