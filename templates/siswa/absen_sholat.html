{% extends "siswa/base_siswa.html" %}

{% block content %}
  <div class="p-5">
    <a href="{% url 'siswa:absen' %}" class="text-sm font-bold text-emerald-800 mb-4 inline-block">← Kembali</a>
    <h1 class="text-lg font-extrabold mb-4">Absen {{ sesi.get_nama_sholat_display }}</h1>

    <div id="pra-scan" class="bg-white rounded-2xl border border-gray-100 p-6 text-center">
      <div class="text-3xl mb-3">🕌</div>
      <p class="text-sm text-gray-500 mb-4">Pindai QR yang sama (gerbang/musholla) untuk absen sholat {{ sesi.get_nama_sholat_display }}.</p>
      <button id="btn-mulai" class="w-full py-3 rounded-xl bg-emerald-800 text-white font-bold">Mulai Scan</button>
    </div>

    <div id="scan-area" class="hidden bg-white rounded-2xl border border-gray-100 p-4">
      <div id="qr-reader" class="rounded-xl overflow-hidden"></div>
      <p id="status-text" class="text-xs text-gray-400 text-center mt-3">Mengarahkan kamera ke QR...</p>
    </div>

    <div id="hasil" class="hidden mt-4 p-4 rounded-2xl text-sm font-bold"></div>
    <button id="btn-ulang" class="hidden w-full mt-4 py-3 rounded-xl border border-gray-200 text-sm font-bold">Coba Lagi</button>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const btnMulai = document.getElementById('btn-mulai');
    const btnUlang = document.getElementById('btn-ulang');
    const praScan = document.getElementById('pra-scan');
    const scanArea = document.getElementById('scan-area');
    const statusText = document.getElementById('status-text');
    const hasilBox = document.getElementById('hasil');
    let html5QrCode;

    btnMulai.addEventListener('click', mulaiScan);
    btnUlang.addEventListener('click', () => {
      hasilBox.classList.add('hidden');
      btnUlang.classList.add('hidden');
      mulaiScan();
    });

    function mulaiScan() {
      praScan.classList.add('hidden');
      scanArea.classList.remove('hidden');
      statusText.textContent = "Mengarahkan kamera ke QR...";

      html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 220 },
        (decodedText) => {
          html5QrCode.stop().then(() => {
            statusText.textContent = "QR terbaca, mengirim...";
            kirimAbsenSholat(decodedText);
          });
        },
        () => {}
      ).catch((err) => {
        scanArea.classList.add('hidden');
        tampilkanHasil(false, "Gagal akses kamera: " + err + ". Pastikan izin kamera diaktifkan di browser.");
      });
    }

    function kirimAbsenSholat(qrText) {
      const bagian = qrText.split(":");
      const token = bagian.length >= 3 ? bagian[2] : qrText;

      fetch("{% url 'siswa:absen_sholat_submit' sesi.id %}", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
        body: JSON.stringify({ qr_token: token }),
      })
        .then((res) => res.json())
        .then((data) => tampilkanHasil(data.ok, data.pesan))
        .catch(() => tampilkanHasil(false, "Terjadi kesalahan jaringan, coba lagi."));
    }

    function tampilkanHasil(ok, pesan) {
      scanArea.classList.add('hidden');
      hasilBox.classList.remove('hidden');
      btnUlang.classList.remove('hidden');
      hasilBox.className = "mt-4 p-4 rounded-2xl text-sm font-bold " + (ok ? "bg-emerald-50 text-emerald-700" : "bg-red-50 text-red-700");
      hasilBox.textContent = pesan;
    }

    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie) {
        for (let cookie of document.cookie.split(";")) {
          cookie = cookie.trim();
          if (cookie.startsWith(name + "=")) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
  </script>
{% endblock %}
